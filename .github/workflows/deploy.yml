name: 构建并部署站点到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许工作流向 GitHub Pages 发布产物
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务；排队中的任务不取消，避免发布半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 安全门禁：docs/ 中若出现任何游戏资源文件或含敏感特征的文件名，
      # 直接让流水线失败。这是「白名单发布」的自动化保障，见 docs/compliance.md。
      - name: 校验文档目录不含资源文件
        run: python scripts/check_assets.py docs

      - name: 构建 MkDocs 站点
        run: mkdocs build --clean

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
